# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

lang: en

timezone: America/Los_Angeles

# jekyll-seo-tag settings
title: Anup Katariya
tagline: Build, fail, learn, build
description: >-
  Engineering leadership, programming, and data science.

url: "https://anuprk.github.io"
baseurl: ""

github:
  username: anuprk

twitter:
  username: anupkatariya

social:
  name: Anup Katariya
  links:
    - https://twitter.com/anupkatariya
    - https://github.com/anuprk
    - https://www.linkedin.com/in/anupkatariya

# Web Analytics Settings
analytics:
  google:
    id:

theme_mode: # empty = follow system preference with toggle

avatar: # add an avatar image path here if you have one

toc: true

comments:
  provider:

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - run.sh
  - TODO.md
  - CNAME

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
